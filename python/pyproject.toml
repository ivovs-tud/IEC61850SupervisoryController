[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wind-farm-scada-attack-client"
version = "0.1.0"
description = "Auxiliary Python client for connecting attack scripts to Wind Farm SCADA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyzmq>=25"]

[tool.setuptools]
license-files = ["LICENSES/HackAWindFarm-Apache-2.0.txt"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scadaAttackInterface*"]
