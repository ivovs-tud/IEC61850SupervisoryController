name: Hardware-free tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formatting:
    name: Formatting (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out supervisory controller
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install clang-format
        run: python -m pip install clang-format==18.1.8

      - name: Check C++ formatting
        run: cmake -DSC_FORMAT_MODE=check -P cmake/RunClangFormat.cmake

  tests:
    name: ${{ matrix.os }}
    needs: formatting
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_REF: 2026.07.29
      VCPKG_DISABLE_METRICS: 1
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.cache/vcpkg,readwrite
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/.cache/vcpkg-installed
      LIBIEC61850_REF: v1.6.2.1
      LIBIEC61850_ROOT: ${{ github.workspace }}/.cache/libiec61850/install

    steps:
      - name: Check out supervisory controller
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Determine dependency cache policy
        id: cache-policy
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            echo "value=${ImageOS:-Windows}-${ImageVersion:-unknown}" >> "${GITHUB_OUTPUT}"
          else
            echo "value=stable" >> "${GITHUB_OUTPUT}"
          fi
          if [[ "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" && ( "${GITHUB_EVENT_NAME}" == "push" || "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ) ]]; then
            echo "write-enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "write-enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Restore libiec61850
        id: libiec61850-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/libiec61850/install
          key: libiec61850-${{ runner.os }}-${{ runner.arch }}-${{ env.LIBIEC61850_REF }}-Debug-${{ steps.cache-policy.outputs.value }}

      - name: Check out libiec61850
        if: steps.libiec61850-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: mz-automation/libiec61850
          ref: ${{ env.LIBIEC61850_REF }}
          path: libiec61850

      - name: Add WinPcap SDK for libiec61850 GOOSE support
        if: runner.os == 'Windows' && steps.libiec61850-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "WpdPack_4_1_2.zip"
          $extracted = Join-Path $env:RUNNER_TEMP "WpdPack_4_1_2"
          Invoke-WebRequest "https://www.winpcap.org/install/bin/WpdPack_4_1_2.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extracted
          New-Item -ItemType Directory -Force -Path "libiec61850/third_party/winpcap" | Out-Null
          Copy-Item -Recurse -Force "$extracted/WpdPack/Include" "libiec61850/third_party/winpcap/Include"
          Copy-Item -Recurse -Force "$extracted/WpdPack/Lib" "libiec61850/third_party/winpcap/Lib"
          Copy-Item -Force "libiec61850/third_party/winpcap/Lib/x64/*.lib" "libiec61850/third_party/winpcap/Lib"

      - name: Configure libiec61850
        if: steps.libiec61850-cache.outputs.cache-hit != 'true'
        run: >-
          cmake -S libiec61850 -B .cache/libiec61850/build
          "-DCMAKE_INSTALL_PREFIX=${{ env.LIBIEC61850_ROOT }}"
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_EXAMPLES=OFF
          -DBUILD_TESTS=OFF
          -DBUILD_PYTHON_BINDINGS=OFF

      - name: Build and install libiec61850
        if: steps.libiec61850-cache.outputs.cache-hit != 'true'
        run: cmake --build .cache/libiec61850/build --config Debug --target install --parallel 4

      - name: Save libiec61850
        if: steps.cache-policy.outputs.write-enabled == 'true' && steps.libiec61850-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/libiec61850/install
          key: ${{ steps.libiec61850-cache.outputs.cache-primary-key }}

      - name: Restore vcpkg binary packages
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/vcpkg
          key: vcpkg-binaries-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_REF }}-tests-${{ hashFiles('vcpkg.json') }}-${{ steps.cache-policy.outputs.value }}
          restore-keys: |
            vcpkg-binaries-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_REF }}-tests-${{ hashFiles('vcpkg.json') }}-
            vcpkg-binaries-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_REF }}-tests-
            vcpkg-binaries-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_REF }}-${{ steps.cache-policy.outputs.value }}-
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_REF }}-

      - name: Restore Windows vcpkg install tree
        if: runner.os == 'Windows'
        id: vcpkg-installed-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/vcpkg-installed
          key: vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_REF }}-tests-${{ hashFiles('vcpkg.json') }}-${{ steps.cache-policy.outputs.value }}
          restore-keys: |
            vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_REF }}-${{ steps.cache-policy.outputs.value }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}

      - name: Prepare vcpkg binary cache
        run: cmake -E make_directory "${{ github.workspace }}/.cache/vcpkg"

      - name: Check out vcpkg
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_REF }}
          path: vcpkg

      - name: Restore Windows vcpkg downloads
        if: runner.os == 'Windows' && steps.vcpkg-installed-cache.outputs.cache-hit != 'true'
        id: vcpkg-downloads-cache
        uses: actions/cache/restore@v6
        with:
          path: vcpkg/downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ env.VCPKG_REF }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-downloads-${{ runner.os }}-${{ env.VCPKG_REF }}-

      - name: Bootstrap vcpkg on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./vcpkg/bootstrap-vcpkg.bat -disableMetrics

      - name: Install Python package
        run: python -m pip install ./python

      - name: Configure on Unix
        if: runner.os != 'Windows'
        run: cmake --preset vcpkg-hardware-free-tests "-DSC_LIBIEC61850_ROOT=${{ env.LIBIEC61850_ROOT }}"

      - name: Configure on Windows
        if: runner.os == 'Windows'
        run: >-
          cmake --preset vcpkg-hardware-free-tests
          "-DVCPKG_INSTALLED_DIR=${{ env.VCPKG_INSTALLED_DIR }}"
          "-DSC_LIBIEC61850_ROOT=${{ env.LIBIEC61850_ROOT }}"

      - name: Save vcpkg binary packages
        if: steps.cache-policy.outputs.write-enabled == 'true' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/vcpkg
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Save Windows vcpkg install tree
        if: runner.os == 'Windows' && steps.cache-policy.outputs.write-enabled == 'true' && steps.vcpkg-installed-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/vcpkg-installed
          key: ${{ steps.vcpkg-installed-cache.outputs.cache-primary-key }}

      - name: Save Windows vcpkg downloads
        if: runner.os == 'Windows' && steps.cache-policy.outputs.write-enabled == 'true' && steps.vcpkg-installed-cache.outputs.cache-hit != 'true' && steps.vcpkg-downloads-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vcpkg/downloads
          key: ${{ steps.vcpkg-downloads-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build --preset vcpkg-hardware-free-tests --parallel 4

      - name: Test
        run: ctest --preset vcpkg-hardware-free-tests
